apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: go-money-postgres
    type: postgres
    access: proxy
    url: $DB_HOST:5432
    user: $DB_USER
    isDefault: true
    editable: false
    jsonData:
      database: $DB
      sslmode: disable
    secureJsonData:
      password: $DB_PASSWORD
